<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/layout.html}">
<head>
  <meta charset="UTF-8">
  <title></title>
</head>
<body>
  <div layout:fragment="main-content">
    Welcome <span th:text="${name}"></span>!
    <form th:object="${magicKeyForm}" th:action="@{/hello/send}" method="post">
      <label for="magicKey" th:text="#{magicKeyLabel}">Magic Key:</label>
      <input type="text" id="magicKey" th:field="*{magicKey}" placeholder="Enter your Magic Key ">
      <button type="submit" th:text="#{magicKeySendButton}">Send</button>
    </form>
  </div>
</body>
</html>
