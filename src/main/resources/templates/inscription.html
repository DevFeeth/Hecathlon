<!DOCTYPE html>
<html
        lang="fr"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/layout.html}">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>
<main layout:fragment="main-content" class="container auth">
    <h1 th:text="#{inscription.title}">Créer un compte</h1>

    <form class="form" th:action="@{/inscription}" th:object="${userForm}" method="post" novalidate>
        <div class="form-row">
            <label>
                <span th:text="#{user.firstName}">Prénom</span>
                <input type="text" th:field="*{firstName}" autocomplete="given-name">
                <small class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></small>
            </label>
            <label>
                <span th:text="#{user.lastName}">Nom</span>
                <input type="text" th:field="*{lastName}" autocomplete="family-name">
                <small class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></small>
            </label>
        </div>
        <label>
            <span th:text="#{user.email}">E-mail</span>
            <input type="email" th:field="*{email}" autocomplete="email">
            <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
        </label>
        <label>
            <span th:text="#{user.password}">Mot de passe</span>
            <!-- no th:field on purpose: the password is never sent back to the browser -->
            <input type="password" name="password" autocomplete="new-password">
            <small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
        </label>
        <button class="btn btn-primary" type="submit" th:text="#{inscription.submit}">Créer mon compte</button>
    </form>

    <p class="auth-switch">
        <span th:text="#{inscription.hasAccount}">Déjà un compte ?</span>
        <a class="link" th:href="@{/login}" th:text="#{login.submit}">Se connecter</a>
    </p>
</main>
</body>
</html>
