<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<head>
    <meta charset="utf-8">
    <title th:text="${title}">Titre par défaut</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}"/>
</head>

<body>
    <div>
        <div sec:authorize="isAuthenticated()">
            <span>Bienvenue, <strong sec:authentication="principal.username">Utilisateur</strong> !</span> |
            <a th:href="@{/logout}" style="color: red;">Logout</a>
        </div>

        <div sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}">Login</a>
        </div>
    </div>

    <div th:replace="~{fragments/fragments.html :: header}"></div>

    <section layout:fragment="main-content"></section>

    <div th:replace="~{fragments/fragments.html :: footer}"></div>
</body>

</html>
