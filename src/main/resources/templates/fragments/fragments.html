<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="header" class="site-header">
    <div class="topbar" th:text="#{topbar.message}">Livraison offerte</div>

    <div class="container header-main">
        <a class="logo" th:href="@{/}">HECATHLON</a>

        <!-- shortcut: search is not wired yet, it reloads the home page -->
        <form class="search" role="search" th:action="@{/}" method="get">
            <span aria-hidden="true">🔍</span>
            <input type="search" name="q" th:placeholder="#{header.search}" th:attr="aria-label=#{header.search}">
        </form>

        <div class="header-actions">
            <a href="#"><span aria-hidden="true">📍</span><span th:text="#{header.store}">Mon magasin</span></a>

            <a sec:authorize="!isAuthenticated()" th:href="@{/login}">
                <span aria-hidden="true">👤</span><span th:text="#{header.account}">Mon compte</span>
            </a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                <button type="submit">
                    <span aria-hidden="true">👤</span>
                    <span><strong sec:authentication="principal.username">user</strong> · <span th:text="#{header.logout}">Déconnexion</span></span>
                </button>
            </form>

            <a href="#"><span aria-hidden="true">🛒</span><span th:text="#{header.cart(0)}">Panier (0)</span></a>

            <div class="lang">
                <a th:href="@{''(lang='fr')}"><img th:src="@{/images/flags/fr.svg}" alt="Français"></a>
                <a th:href="@{''(lang='en')}"><img th:src="@{/images/flags/uk.svg}" alt="English"></a>
            </div>
        </div>
    </div>

    <nav class="main-nav">
        <div class="container">
            <a href="#" th:text="#{nav.allSports}">Tous les sports</a>
            <a href="#" th:each="sport : ${sports}" th:text="#{${'sport.' + sport.id}}">Sport</a>
            <a href="#" class="promo" th:text="#{nav.promotions}">Promotions</a>
        </div>
    </nav>
</header>

<!-- Picture of a sport/product: shows the image when set, otherwise a coloured placeholder for the sport -->
<div th:fragment="media(image, sportId)" class="media" th:classappend="'ph-' + ${sportId}">
    <img th:if="${image != null}" th:src="@{${image}}" alt="">
</div>

<p th:fragment="price(p)" class="price">
    <span th:classappend="${p.discountPercent > 0} ? 'sale'"
          th:text="${#numbers.formatDecimal(p.price, 1, 2, 'COMMA')} + ' €'">0,00 €</span>
    <del th:if="${p.discountPercent > 0}"
         th:text="${#numbers.formatDecimal(p.oldPrice, 1, 2, 'COMMA')} + ' €'">0,00 €</del>
</p>

<footer th:fragment="footer" class="site-footer">
    <div class="container footer-grid">
        <div>
            <a class="logo" th:href="@{/}">HECATHLON</a>
            <p th:text="#{footer.tagline}">Le sport nous rassemble.</p>
        </div>
        <div>
            <h3 th:text="#{footer.help}">Besoin d'aide ?</h3>
            <a href="#" th:text="#{footer.orders}">Suivre ma commande</a>
            <a href="#" th:text="#{footer.delivery}">Livraison &amp; retrait</a>
            <a href="#" th:text="#{footer.returns}">Retours</a>
        </div>
        <div>
            <h3 th:text="#{nav.allSports}">Tous les sports</h3>
            <a href="#" th:each="sport : ${sports}" th:text="#{${'sport.' + sport.id}}">Sport</a>
        </div>
    </div>
    <div class="container footer-bottom">
        <span th:text="#{footer.rights}">© 2026 Hecathlon</span>
        <span th:text="#{footer.payment}">Paiement sécurisé</span>
    </div>
</footer>

</body>
</html>
