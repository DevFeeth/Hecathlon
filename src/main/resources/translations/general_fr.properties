about.title=Le sport nous rassemble.
about.intro=Hecathlon est une enseigne belge de matériel de sport, née à Namur, qui équipe les coureurs, les footballeurs et les cyclistes, du premier pas à la compétition.
about.story.title=Notre histoire
about.story.text=Tout a commencé dans un petit atelier où une bande de passionnés réparait des vélos et conseillait les coureurs du quartier. Aujourd'hui, Hecathlon conçoit sa propre gamme (Élan Running, Élan Football, Élan Vélo) et la propose en ligne, avec la même envie : rendre le sport accessible à tous.
