about.title=Sport brings us together.
about.intro=Hecathlon is a Belgian sports equipment brand, born in Namur, that equips runners, football players and cyclists, from the first step to competition.
about.story.title=Our story
about.story.text=It all started in a small workshop where a group of enthusiasts repaired bikes and advised the local runners. Today Hecathlon designs its own range (Élan Running, Élan Football, Élan Vélo) and sells it online, with the same goal: making sport accessible to everyone.
about.value1.title=The right gear
about.value1.text=Products tested by our teams at fair prices, to get started or to progress.
about.value2.title=Make it last
about.value2.text=Repair workshops and spare parts to extend the life of your equipment.
about.value3.title=Shop with confidence
about.value3.text=Secure payment, protected data and free returns for 30 days.
about.contact.title=Contact us
about.contact.note=Hecathlon is a student project made for the advanced web development course at Hénallux.
